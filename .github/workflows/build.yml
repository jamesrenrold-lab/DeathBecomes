name: Build mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - run: gradle build
      - run: gradle -p AttributeCommandPersist build
      - uses: actions/upload-artifact@v4
        with:
          name: DeathBecomes-and-AttributeCommandPersist-forge-1.20.1
          path: |
            build/libs/*.jar
            AttributeCommandPersist/build/libs/*.jar
